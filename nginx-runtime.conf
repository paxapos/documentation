server {
    listen 8080;
    server_name _;

    root /usr/share/nginx/html;
    index index.html;

    # Charset y tokens
    charset utf-8;
    server_tokens off;
    absolute_redirect off;

    # ─── Compresión gzip ──────────────────────────────────────
    gzip on;
    gzip_vary on;
    gzip_min_length 1024;
    gzip_comp_level 6;
    gzip_types
        text/plain
        text/css
        text/xml
        text/javascript
        application/javascript
        application/xml+rss
        application/json
        application/manifest+json
        image/svg+xml;

    # ─── Headers de seguridad (global) ────────────────────────
    # CSP: script-src 'self' permite solo scripts propios.
    # style-src necesita 'unsafe-inline' porque SvelteKit genera estilos inline.
    add_header X-Frame-Options "SAMEORIGIN" always;
    add_header X-Content-Type-Options "nosniff" always;
    add_header X-XSS-Protection "0" always;
    add_header Referrer-Policy "strict-origin-when-cross-origin" always;
    add_header Permissions-Policy "camera=(), microphone=(), geolocation=(), payment=()" always;
    add_header Strict-Transport-Security "max-age=31536000; includeSubDomains" always;
    add_header Content-Security-Policy "default-src 'self'; script-src 'self' 'unsafe-inline'; style-src 'self' 'unsafe-inline'; img-src 'self' data: https:; font-src 'self' data:; connect-src 'self'; frame-ancestors 'self'" always;

    # ─── Raíz → manual ───────────────────────────────────────────────
    location = / {
        return 301 /user-guide;
    }

    # ─── Índices generados en build (cambian con cada deploy) ───
    # Solo `expires` (sin add_header) para heredar los headers de seguridad.
    location ~* ^/(search-index\.json|sitemap\.xml|robots\.txt|llms\.txt|llms/.*)$ {
        expires 1h;
    }

    # ─── Páginas prerendereadas ──────────────────────────────────
    # El prerender deja `<ruta>.html` y un directorio `<ruta>/` (con __data.json),
    # por eso $uri.html va antes que $uri/ y se normaliza el trailing slash.
    location / {
        rewrite ^/(.+)/$ /$1 permanent;
        try_files $uri.html $uri /index.html;
    }

    # ─── Cache de assets estáticos (1 año, inmutable) ─────────
    location ~* \.(js|css|png|jpg|jpeg|gif|ico|svg|woff|woff2|ttf|eot)$ {
        expires 1y;
        add_header Cache-Control "public, immutable";
        access_log off;
    }

    # ─── Health check ─────────────────────────────────────────
    location /health {
        access_log off;
        return 200 "healthy\n";
        add_header Content-Type text/plain;
    }

    # ─── Bloqueo de archivos sensibles ────────────────────────
    location ~ /\. {
        deny all;
        access_log off;
        log_not_found off;
    }

    # ─── Logging ──────────────────────────────────────────────
    access_log /var/log/nginx/access.log;
    error_log /var/log/nginx/error.log warn;

    # ─── Error pages ──────────────────────────────────────────
    error_page 404 /index.html;
    error_page 500 502 503 504 /index.html;
}