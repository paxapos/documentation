# ─── Redirecciones 301 de URLs viejas del manual ─────────────
# Este archivo se incluye en el contexto http (conf.d), así que el map va fuera
# del server. Acepta la URL con o sin barra final. Ver paxapos/documentation#241.
map $uri $manual_redirect {
    default "";

    # Slugs de módulos que ya no existen
    ~^/user-guide/arca-y-facturacion/?$          /user-guide/punto-de-venta;
    ~^/user-guide/compras-y-stock/?$             /user-guide/stock-mercaderias;
    ~^/user-guide/reportes/?$                    /user-guide/tablero-general;
    ~^/user-guide/dashboard-home/?$              /user-guide/tablero-general;
    ~^/user-guide/roles/?$                       /user-guide/permisos-por-rol;
    ~^/user-guide/configuracion-impresion/?$     /user-guide/perfiles-de-impresion;
    ~^/user-guide/configuracion-de-impresoras/?$ /user-guide/impresoras;
    ~^/user-guide/config-del-comercio/?$         /user-guide/configuracion-general;
    ~^/user-guide/crear-usuarios/?$              /user-guide/usuarios-del-sistema;
    ~^/user-guide/agregar-personal/?$            /user-guide/empleados;

    # FAQ e IA: antes el slug conservaba el sub-número (06-faq-…, 01-ia-…) y
    # Google además rastreó la forma con el prefijo de carpeta (151-06-faq-…).
    ~^/user-guide/(?:151-)?\d+-(faq-[a-z0-9-]+?)/?$ /user-guide/$1;
    ~^/user-guide/(?:156-)?\d+-(ia-[a-z0-9-]+?)/?$  /user-guide/$1;
}

# ─── Archivos que no son páginas: que Google no los indexe ────
# Los .txt de /llms duplican el texto de cada artículo y competían con él.
# Los crawlers de IA los siguen pudiendo leer (noindex no bloquea el acceso).
map $uri $robots_tag {
    default        "";
    ~^/llms(/|\.txt$) "noindex";
    ~\.json$       "noindex";
    /urls.txt      "noindex";
}

server {
    listen 8080;
    server_name _;

    root /usr/share/nginx/html;
    index index.html;

    # Charset y tokens
    charset utf-8;
    server_tokens off;
    absolute_redirect off;

    # ─── Compresión gzip ──────────────────────────────────────
    gzip on;
    gzip_vary on;
    gzip_min_length 1024;
    gzip_comp_level 6;
    gzip_types
        text/plain
        text/css
        text/xml
        text/javascript
        application/javascript
        application/xml+rss
        application/json
        application/manifest+json
        image/svg+xml;

    # ─── Headers de seguridad (global) ────────────────────────
    # CSP: script-src 'self' permite solo scripts propios.
    # style-src necesita 'unsafe-inline' porque SvelteKit genera estilos inline.
    add_header X-Frame-Options "SAMEORIGIN" always;
    add_header X-Content-Type-Options "nosniff" always;
    add_header X-XSS-Protection "0" always;
    add_header Referrer-Policy "strict-origin-when-cross-origin" always;
    add_header Permissions-Policy "camera=(), microphone=(), geolocation=(), payment=()" always;
    add_header Strict-Transport-Security "max-age=31536000; includeSubDomains" always;
    # Vacío (páginas) = nginx no manda el header.
    add_header X-Robots-Tag $robots_tag always;
    add_header Content-Security-Policy "default-src 'self'; script-src 'self' 'unsafe-inline'; style-src 'self' 'unsafe-inline'; img-src 'self' data: https:; font-src 'self' data:; connect-src 'self'; frame-ancestors 'self'" always;

    # ─── URLs viejas → artículo actual (map de arriba) ──────────
    if ($manual_redirect) {
        return 301 $manual_redirect;
    }

    # ─── Raíz → manual ───────────────────────────────────────────────
    location = / {
        return 301 /user-guide;
    }

    # index.html es solo el redirect a /user-guide: que no se sirva como página.
    location = /index.html {
        return 301 /user-guide;
    }

    # Página de error: la genera el build (fallback de adapter-static).
    location = /404.html {
        internal;
    }

    # ─── Índices generados en build (cambian con cada deploy) ───
    # Solo `expires` (sin add_header) para heredar los headers de seguridad.
    location ~* ^/(search-index\.json|sitemap\.xml|robots\.txt|llms\.txt|llms/.*)$ {
        expires 1h;
    }

    # ─── Páginas prerendereadas ──────────────────────────────────
    # El prerender deja `<ruta>.html` y un directorio `<ruta>/` (con __data.json),
    # por eso $uri.html va antes que $uri/ y se normaliza el trailing slash.
    # `/x.html` redirige a `/x` para no tener dos URLs con el mismo contenido.
    # Lo que no existe da 404 real: antes caía en /index.html con 200 y Google
    # lo tomaba como soft 404 o duplicado de la home.
    location / {
        rewrite ^/(.+)/$ /$1 permanent;
        rewrite ^/(.+)\.html$ /$1 permanent;
        try_files $uri.html $uri =404;
    }

    # ─── Cache de assets estáticos (1 año, inmutable) ─────────
    location ~* \.(js|css|png|jpg|jpeg|gif|ico|svg|woff|woff2|ttf|eot)$ {
        expires 1y;
        add_header Cache-Control "public, immutable";
        access_log off;
    }

    # ─── Health check ─────────────────────────────────────────
    location /health {
        access_log off;
        return 200 "healthy\n";
        add_header Content-Type text/plain;
    }

    # ─── Bloqueo de archivos sensibles ────────────────────────
    location ~ /\. {
        deny all;
        access_log off;
        log_not_found off;
    }

    # ─── Logging ──────────────────────────────────────────────
    access_log /var/log/nginx/access.log;
    error_log /var/log/nginx/error.log warn;

    # ─── Error pages ──────────────────────────────────────────
    error_page 404 /404.html;
}