version: '3.8'

services:
    # ============================================
    # Manual de usuario PaxaPOS (doc.paxapos.com)
    # ============================================
    paxapos-docs:
        build:
            context: .
            dockerfile: Dockerfile
        image: yoalevilar/paxapos-docs:latest
        container_name: paxapos-docs
        restart: unless-stopped

        # Los headers de seguridad, la CSP, el cache y los redirects los pone la app
        # (server/http-rules.mjs): no duplicarlos en Traefik.
        environment:
            - TZ=America/Argentina/Buenos_Aires
            - ORIGIN=https://doc.paxapos.com

        ports:
            - '3000:8080'

        networks:
            - web

        healthcheck:
            test:
                ['CMD', 'wget', '--quiet', '--tries=1', '--spider', 'http://127.0.0.1:8080/health']
            interval: 30s
            timeout: 10s
            retries: 3
            start_period: 40s

        labels:
            - 'traefik.enable=true'
            - 'traefik.http.routers.paxapos-docs.rule=Host(`doc.paxapos.com`)'
            - 'traefik.http.routers.paxapos-docs.entrypoints=websecure'
            - 'traefik.http.routers.paxapos-docs.tls.certresolver=letsencrypt'
            - 'traefik.http.services.paxapos-docs-service.loadbalancer.server.port=8080'

        security_opt:
            - no-new-privileges:true

        read_only: false

networks:
    web:
        external: true
